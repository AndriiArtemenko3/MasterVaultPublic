name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable so release automation can run this exact suite as a prerequisite
  # rather than restating it. `.github/workflows/publish.yml` gates PyPI
  # publication on this workflow succeeding for the tagged commit, which is
  # what keeps the release gate and the pull-request gate from drifting apart.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The measured floor, over the honest denominator. SQLite-only runs at 83%
  # and the postgres job at 85% (0.2.0 baseline, 5579 statements); 82 leaves one
  # point of slack without letting real coverage loss through.
  #
  # These numbers replace an earlier 85/87 that were inflated: the coverage
  # `exclude_also` pattern for Protocol stub bodies was unanchored, so it also
  # matched `typer.Option(...)` defaults in multi-line signatures and coverage
  # excluded the WHOLE function -- 254 statements, including most of the
  # `mvault ask` / `ingest` / `review` command bodies, were missing from the
  # denominator. Raise this when the measured number rises; never lower it to
  # make a red build green.
  COVERAGE_FLOOR: "82"

jobs:
  quality:
    name: lint + types + deterministic gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Install (with dev + rerank extras; no optional PDF models)
        run: uv sync --extra dev --extra rerank

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy, blocking)
        run: uv run mypy src

      - name: Raw corpus mechanical QA (non-mutating blocker gate)
        run: uv run python datasets/larkstead/qa/mechanical_check.py --check

      - name: Deterministic PDF fixture gate
        run: uv run python datasets/larkstead/qa/generate_pdf_fixtures.py --check

  sqlite_unit:
    name: sqlite unit (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: generation-a
            pytest_args: >-
              tests/unit/change_control/test_managed_generation_activation.py
              -m generation_activation_a
          - id: generation-b
            pytest_args: >-
              tests/unit/change_control/test_managed_generation_activation.py
              -m generation_activation_b
          - id: generation-c
            pytest_args: >-
              tests/unit/change_control/test_managed_generation_activation.py
              -m generation_activation_c
          - id: generation-d
            pytest_args: >-
              tests/unit/change_control/test_managed_generation_activation.py
              -m generation_activation_d
          - id: managed-admission
            pytest_args: tests/unit/change_control/test_managed_revision_admission.py
          - id: managed-review
            pytest_args: tests/unit/change_control/test_managed_review_service.py
          - id: managed-workflow
            pytest_args: tests/unit/change_control/test_managed_workflow.py
          - id: change-lifecycle
            pytest_args: tests/unit/change_control/test_application*.py
          - id: remainder
            pytest_args: >-
              tests/unit
              --ignore=tests/unit/change_control/test_managed_generation_activation.py
              --ignore=tests/unit/change_control/test_managed_revision_admission.py
              --ignore=tests/unit/change_control/test_managed_review_service.py
              --ignore=tests/unit/change_control/test_managed_workflow.py
              --ignore-glob=tests/unit/change_control/test_application*.py
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (with dev + rerank extras; no optional PDF models)
        run: uv sync --extra dev --extra rerank

      - name: Unit tests (${{ matrix.id }})
        env:
          COVERAGE_FILE: .coverage.${{ matrix.id }}
        # Layer exact CI-only tooling over the locked project environment so a
        # test runner cannot change the frozen application/evaluation identity.
        # Two fixed workers avoid oversubscription; a worker crash must fail.
        run: >-
          uv run --locked
          --with pytest-xdist==3.8.0 --with execnet==2.1.2
          pytest -q -n 2 --dist worksteal --max-worker-restart=0
          ${{ matrix.pytest_args }}
          --cov --cov-report=
          --junitxml=junit-${{ matrix.id }}.xml

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Keep attempts disjoint: a partial rerun must not silently combine
          # fresh shard data with evidence left by an earlier attempt.
          name: sqlite-unit-${{ matrix.id }}-attempt-${{ github.run_attempt }}
          path: |
            junit-${{ matrix.id }}.xml
            .coverage.${{ matrix.id }}
          include-hidden-files: true
          if-no-files-found: error

  sqlite_integration:
    name: sqlite integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (with dev + rerank extras; no optional PDF models)
        run: uv sync --extra dev --extra rerank

      - name: Integration tests (sqlite backend)
        env:
          COVERAGE_FILE: .coverage.integration
        run: >-
          uv run pytest -q tests/integration
          --cov --cov-report=
          --junitxml=junit-integration.xml

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-integration-attempt-${{ github.run_attempt }}
          path: |
            junit-integration.xml
            .coverage.integration
          include-hidden-files: true
          if-no-files-found: error

  test:
    # Keep the established external check name. This always runs so a failed or
    # cancelled shard becomes a red aggregate gate instead of a misleading skip.
    name: lint + types + tests (sqlite)
    needs: [quality, sqlite_unit, sqlite_integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install coverage tooling
        run: uv sync --extra dev --extra rerank

      - name: Download SQLite shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: sqlite-*-attempt-${{ github.run_attempt }}
          path: sqlite-evidence
          merge-multiple: true

      - name: Consolidate SQLite JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sqlite
          path: sqlite-evidence/junit-*.xml
          if-no-files-found: warn
          overwrite: true

      - name: Require every prerequisite
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          UNIT_RESULT: ${{ needs.sqlite_unit.result }}
          INTEGRATION_RESULT: ${{ needs.sqlite_integration.result }}
        run: |
          test "${QUALITY_RESULT}" = "success"
          test "${UNIT_RESULT}" = "success"
          test "${INTEGRATION_RESULT}" = "success"

      - name: Require all ten evidence shards
        run: |
          coverage_count="$(find sqlite-evidence -maxdepth 1 -type f -name '.coverage.*' | wc -l)"
          junit_count="$(find sqlite-evidence -maxdepth 1 -type f -name 'junit-*.xml' | wc -l)"
          test "${coverage_count}" -eq 10
          test "${junit_count}" -eq 10

      - name: Combine coverage
        run: uv run coverage combine sqlite-evidence

      - name: Coverage report + regression floor
        run: |
          uv run coverage report
          uv run coverage report --fail-under="${COVERAGE_FLOOR}"

  postgres:
    name: storage contract (postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mastervault
          POSTGRES_PASSWORD: mastervault
          POSTGRES_DB: mastervault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mastervault -d mastervault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # An ephemeral service container, created and destroyed with the job. The
      # suite still carves out its own throwaway database per session and its own
      # schema per test inside it (tests/conftest.py), so nothing here depends on
      # -- or can reach -- a developer's database.
      DATABASE_URL: postgresql://mastervault:mastervault@localhost:5432/mastervault
      # Turns "postgres unreachable -> skip" into a hard failure, and fails the
      # session if any postgres-backed test skipped anyway. Without this the job
      # would pass green while testing nothing.
      MV_REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (with dev + rerank extras; no optional PDF models)
        run: uv sync --extra dev --extra rerank

      # The marker is attached to every postgres backend parameter and direct
      # pg_test_url consumer. Collection fails if a future postgres item is not
      # marked, so this avoids rerunning five hours of SQLite-only unit tests
      # without narrowing the actual PostgreSQL contract.
      - name: PostgreSQL contract tests
        run: uv run pytest -q -m postgres_contract --junitxml=junit-postgres.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-postgres
          path: junit-*.xml
          if-no-files-found: ignore
          overwrite: true

  eval:
    name: retrieval + ask eval regression gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: fastembed-bge-small-en-v1.5

      - name: Load demo dataset (keyless, precomputed sidecar)
        run: |
          uv run mvault init
          uv run mvault demo load

      - name: Pristine demo mechanical lint
        run: uv run mvault lint --mechanical-only

      # Two gates, deliberately reported separately: `eval` grades retrieval
      # ranking, `ask-eval` grades the whole ask pipeline end to end. A single
      # merged number would move for either reason and mean neither.
      - name: Retrieval eval regression gate vs frozen baseline
        run: uv run mvault eval --compare datasets/larkstead/golden/baseline.json

      - name: End-to-end ask eval regression gate vs frozen baseline
        run: uv run mvault ask-eval --compare datasets/larkstead/golden/ask_baseline.json

  package:
    name: build + clean-install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # Builds the sdist and wheel, scans both for workspaces/caches/secrets/
      # test output, installs the wheel into a clean venv, and runs a CLI smoke
      # flow (init -> sync -> search -> ask -> lint) from the installed artifact.
      - name: Build, scan and smoke-test the distributions
        run: ./scripts/check-package.sh

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          overwrite: true
