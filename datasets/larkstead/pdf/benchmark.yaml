schema_version: 1
dataset_id: larkstead-pdf-layout-benchmark
description: >-
  A bounded, family-separated clean-digital benchmark derived from existing
  Larkstead semantic sources. It tests layout, tables, reading order, and
  page-grounded evidence without introducing OCR or a second business corpus.
license: CC-BY-4.0

size_budget:
  max_total_pdf_bytes: 1048576
  max_single_pdf_bytes: 65536
  target_semantic_documents: 6
  variants_per_document: 4

layout_profiles:
  - variant_id: single-column
    description: Portrait, one-column business-document baseline.
    columns: 1
    landscape: false
    table_emphasis: false
    repeated_furniture: false
    force_page_break: false
    layout_features:
      - clean-digital
      - native-text
      - single-column
      - semantic-order
  - variant_id: two-column
    description: Landscape two-column flow with left-column-first reading order.
    columns: 2
    landscape: true
    table_emphasis: false
    repeated_furniture: false
    force_page_break: false
    layout_features:
      - clean-digital
      - native-text
      - two-column
      - explicit-reading-order
  - variant_id: table-emphasis
    description: Landscape single-column layout with high-contrast source tables.
    columns: 1
    landscape: true
    table_emphasis: true
    repeated_furniture: false
    force_page_break: false
    layout_features:
      - clean-digital
      - native-text
      - table-forward-styling
  - variant_id: repeated-furniture
    description: Portrait layout forced across pages with repeated header and footer furniture.
    columns: 1
    landscape: false
    table_emphasis: false
    repeated_furniture: true
    force_page_break: true
    layout_features:
      - clean-digital
      - native-text
      - repeated-header
      - repeated-footer
      - forced-pagination

